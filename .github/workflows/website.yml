# M8: the launch page (apps/website) on GitHub Pages. Enable Pages → "GitHub Actions" in the repo settings,
# and add apps/website/CNAME (capfolder.com) once the domain points at Pages.
name: website
on:
  push:
    branches: [main]
    paths: ["apps/website/**"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm i --frozen-lockfile && pnpm --filter @capfolder/website test # no placeholders or false claims
      - name: Only the public files
        run: |
          mkdir _site
          cd apps/website && cp -r index.html *.png *.ico *.svg site.webmanifest fonts ../../_site/ && { [ -f CNAME ] && cp CNAME ../../_site/ || true; }
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
