# F-38 (docs/07): signed builds for every OS into a draft release with latest.json for the updater.
# Bump the version (package.json, Cargo.toml, tauri.conf.json), push, then run it: gh workflow run release.yml
# (-f allow_unsigned=true for a beta). Check the draft on GitHub, then publish it: installed apps update to the latest
# published release. No tag trigger: publishing creates the tag, which would start a second build.
name: release
on:
  workflow_dispatch:
    inputs:
      allow_unsigned:
        description: "Beta: build without Apple/Microsoft certificates (macOS ad-hoc signed). Publish it as a normal release so testers and the updater find it."
        type: boolean
        default: false
      windows_unsigned:
        description: "Sign macOS but not Windows (no Microsoft certificate yet). Windows users click More info → Run anyway."
        type: boolean
        default: true
permissions:
  contents: write
env:
  BETA_NOTES: |
    Beta. These installers aren't signed with Apple or Microsoft certificates yet, so your computer warns before the first start. Installed apps update themselves from here.
    - macOS: open the .dmg and drag Capfolder to Applications. Open it once; when macOS says it can't check it, go to System Settings → Privacy & Security, scroll down and click "Open Anyway". (Or run: xattr -dr com.apple.quarantine /Applications/Capfolder.app)
    - Windows: run the -setup.exe. On "Windows protected your PC", click More info → Run anyway.
    - Linux: the .AppImage (chmod +x, then run it) or the .deb.
    Found a bug? https://github.com/MKBSP/capfolder/issues
  WINDOWS_UNSIGNED_NOTES: |
    The macOS app is signed and notarized. The Windows installer isn't signed yet: on "Windows protected your PC", click More info → Run anyway. Installed apps update themselves from here.
    Found a bug? https://github.com/MKBSP/capfolder/issues
jobs:
  # Not blocking: lists the help pages (capfolder.com/help) whose app screens changed since they were last checked.
  help-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: node scripts/help-check.mjs | tee -a "$GITHUB_STEP_SUMMARY"
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, args: "--target aarch64-apple-darwin", rust: aarch64-apple-darwin }
          - { os: macos-latest, args: "--target x86_64-apple-darwin", rust: x86_64-apple-darwin }
          - { os: windows-latest, args: "", rust: "" }
          - { os: ubuntu-22.04, args: "", rust: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Ship nothing unsigned
        shell: bash
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          ALLOW_UNSIGNED: ${{ inputs.allow_unsigned }}
          WINDOWS_UNSIGNED: ${{ inputs.windows_unsigned }}
        run: |
          [ -n "$UPDATER_KEY" ] || { echo "TAURI_SIGNING_PRIVATE_KEY is missing"; exit 1; }
          [ "$ALLOW_UNSIGNED" = "true" ] && exit 0
          case "${{ runner.os }}" in
            # all of them: without the password/team/identity Tauri skips notarization with only a warning
            macOS) for v in APPLE_CERTIFICATE APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_SIGNING_IDENTITY; do
                     [ -n "${!v}" ] || { echo "$v is missing"; exit 1; }; done ;;
            Windows) [ "$WINDOWS_UNSIGNED" = "true" ] || [ -n "$WINDOWS_CERTIFICATE" ] || { echo "WINDOWS_CERTIFICATE is missing"; exit 1; } ;;
          esac
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.rust }}" }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }
      - run: pnpm i --frozen-lockfile
      - name: Windows certificate → thumbprint
        if: runner.os == 'Windows' && inputs.allow_unsigned != true && inputs.windows_unsigned != true
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          if ($env:WINDOWS_CERTIFICATE_PASSWORD) {
            $pw = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          } else {
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My
          }
          Remove-Item $pfx
          $conf = @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = "sha256"; timestampUrl = "http://timestamp.digicert.com" } } } | ConvertTo-Json -Depth 5
          Set-Content -Path apps/desktop/src-tauri/tauri.windows.conf.json -Value $conf
      # Tauri imports a certificate (and notarizes) whenever these variables exist, even empty, so a beta build must
      # not set them at all. Release builds get them here.
      - name: Apple certificate and notarization
        if: runner.os == 'macOS' && inputs.allow_unsigned != true
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            printf '%s<<__END__\n%s\n__END__\n' "$v" "${!v}" >> "$GITHUB_ENV"
          done
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # beta: "-" is ad-hoc signing, which Apple Silicon needs to open the app at all ("damaged" otherwise)
          APPLE_SIGNING_IDENTITY: ${{ inputs.allow_unsigned && '-' || secrets.APPLE_SIGNING_IDENTITY }}
        with:
          projectPath: apps/desktop
          # Beta builds are ordinary releases (not prereleases): /releases/latest, the website links and the updater
          # only see those. Versions stay plain x.y.z (Windows MSI rejects "-beta"); the name says beta.
          tagName: v__VERSION__
          releaseName: ${{ inputs.allow_unsigned && 'Capfolder v__VERSION__ (beta, unsigned)' || 'Capfolder v__VERSION__' }}
          prerelease: false
          releaseBody: ${{ inputs.allow_unsigned && env.BETA_NOTES || inputs.windows_unsigned && env.WINDOWS_UNSIGNED_NOTES || 'See CHANGELOG.md. Downloads are signed; installed apps update themselves once this release is published.' }}
          releaseDraft: true
          includeUpdaterJson: true
          args: ${{ matrix.args }}
