name: Bug
description: Something in Capfolder is wrong or broken
labels: [bug, beta]
body:
  - type: markdown
    attributes:
      value: "**Never attach a real cap table or signed documents.** Replace names, emails and amounts with made-up ones."
  - type: input
    id: version
    attributes: { label: Capfolder version, description: "Settings → Updates shows it", placeholder: "0.1.0" }
    validations: { required: true }
  - type: dropdown
    id: os
    attributes:
      label: Computer
      options: [macOS (Apple Silicon), macOS (Intel), Windows 11, Windows 10, Linux (AppImage), Linux (.deb), Other]
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: What you did, description: Step by step, so we can repeat it }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What you expected, and what happened instead }
    validations: { required: true }
  - type: dropdown
    id: install
    attributes:
      label: Did installing need extra steps?
      options: ["No", "Yes: Open Anyway / Run anyway", "Yes: something else (describe above)"]
